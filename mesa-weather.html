<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mesa, AZ Weather Forecast</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 36px;
      max-width: 700px;
      width: 100%;
      color: #fff;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 10px;
    }

    .location-icon { font-size: 28px; }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255,255,255,0.55);
      font-size: 0.85rem;
      margin-bottom: 28px;
      padding-left: 42px;
    }

    .loading, .error {
      text-align: center;
      padding: 40px 0;
      font-size: 1rem;
      color: rgba(255,255,255,0.6);
    }

    .error { color: #ff6b6b; }

    /* ── Forecast grid ── */
    .forecast-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .day-card {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, border-color 0.2s;
      user-select: none;
    }

    .day-card:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-3px);
    }

    .day-card.today {
      background: rgba(99, 179, 237, 0.2);
      border-color: rgba(99, 179, 237, 0.5);
    }

    .day-card.selected {
      background: rgba(251, 211, 141, 0.18);
      border-color: rgba(251, 211, 141, 0.6);
      transform: translateY(-3px);
    }

    .day-name {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255,255,255,0.55);
      margin-bottom: 10px;
    }

    .day-card.today .day-name  { color: #63b3ed; }
    .day-card.selected .day-name { color: #fbd38d; }

    .weather-icon { font-size: 2.2rem; margin-bottom: 10px; }

    .condition {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      margin-bottom: 12px;
      min-height: 28px;
      line-height: 1.3;
    }

    .temps {
      display: flex;
      justify-content: center;
      gap: 8px;
      align-items: baseline;
    }

    .temp-high {
      font-size: 1.2rem;
      font-weight: 700;
      color: #fbd38d;
    }

    .temp-low {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.4);
    }

    .precip {
      margin-top: 10px;
      font-size: 0.7rem;
      color: rgba(147, 197, 253, 0.7);
    }

    .click-hint {
      margin-top: 12px;
      font-size: 0.65rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.5px;
    }

    /* ── Hourly panel ── */
    .hourly-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease, opacity 0.25s ease, margin-top 0.25s ease;
      opacity: 0;
      margin-top: 0;
    }

    .hourly-panel.open {
      max-height: 600px;
      opacity: 1;
      margin-top: 18px;
    }

    .hourly-inner {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 20px;
    }

    .hourly-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .hourly-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #fbd38d;
    }

    .close-btn {
      background: rgba(255,255,255,0.1);
      border: none;
      color: rgba(255,255,255,0.6);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .close-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

    .hourly-scroll {
      overflow-y: auto;
      max-height: 420px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.15) transparent;
    }

    .hourly-scroll::-webkit-scrollbar { width: 4px; }
    .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }

    .hour-row {
      display: grid;
      grid-template-columns: 60px 32px 1fr auto auto;
      align-items: center;
      gap: 10px;
      padding: 8px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.82rem;
    }

    .hour-row:last-child { border-bottom: none; }

    .hour-time {
      color: rgba(255,255,255,0.45);
      font-size: 0.75rem;
    }

    .hour-icon { font-size: 1.2rem; text-align: center; }

    .hour-condition { color: rgba(255,255,255,0.6); font-size: 0.75rem; }

    .hour-temp {
      font-weight: 700;
      color: #fbd38d;
      text-align: right;
      white-space: nowrap;
    }

    .hour-precip {
      font-size: 0.7rem;
      color: rgba(147,197,253,0.7);
      text-align: right;
      min-width: 40px;
    }

    .updated {
      text-align: right;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      margin-top: 20px;
    }

    @media (max-width: 500px) {
      .forecast-grid { grid-template-columns: repeat(3, 1fr); }
      h1 { font-size: 1.4rem; }
      .hour-row { grid-template-columns: 52px 28px 1fr auto; }
      .hour-precip { display: none; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <span class="location-icon">📍</span>
      <h1>Mesa, Arizona</h1>
    </div>
    <p class="subtitle">5-Day Weather Forecast &nbsp;·&nbsp; United States</p>

    <div id="content"><div class="loading">Fetching forecast...</div></div>

    <div class="hourly-panel" id="hourly-panel">
      <div class="hourly-inner">
        <div class="hourly-header">
          <span class="hourly-title" id="hourly-title"></span>
          <button class="close-btn" id="close-btn" aria-label="Close">✕</button>
        </div>
        <div class="hourly-scroll" id="hourly-rows"></div>
      </div>
    </div>

    <div class="updated" id="updated"></div>
  </div>

  <script>
    const WMO = {
      0:  ['☀️', 'Clear sky'],
      1:  ['🌤️', 'Mainly clear'],
      2:  ['⛅', 'Partly cloudy'],
      3:  ['☁️', 'Overcast'],
      45: ['🌫️', 'Foggy'],
      48: ['🌫️', 'Icy fog'],
      51: ['🌦️', 'Light drizzle'],
      53: ['🌦️', 'Drizzle'],
      55: ['🌧️', 'Heavy drizzle'],
      61: ['🌧️', 'Slight rain'],
      63: ['🌧️', 'Moderate rain'],
      65: ['🌧️', 'Heavy rain'],
      71: ['🌨️', 'Slight snow'],
      73: ['🌨️', 'Moderate snow'],
      75: ['❄️', 'Heavy snow'],
      77: ['🌨️', 'Snow grains'],
      80: ['🌦️', 'Rain showers'],
      81: ['🌧️', 'Heavy showers'],
      82: ['⛈️', 'Violent showers'],
      85: ['🌨️', 'Snow showers'],
      86: ['🌨️', 'Heavy snow showers'],
      95: ['⛈️', 'Thunderstorm'],
      96: ['⛈️', 'Thunderstorm + hail'],
      99: ['⛈️', 'Thunderstorm + hail'],
    };

    function wmoLookup(code) { return WMO[code] || ['🌡️', 'Unknown']; }
    function celsiusToF(c)   { return Math.round(c * 9/5 + 32); }

    function formatDay(dateStr, index) {
      const d = new Date(dateStr + 'T12:00:00');
      if (index === 0) return 'Today';
      return d.toLocaleDateString('en-US', { weekday: 'short' });
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    function formatHour(isoStr) {
      const d = new Date(isoStr);
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
    }

    async function fetchWeather() {
      const url =
        'https://api.open-meteo.com/v1/forecast' +
        '?latitude=33.4152&longitude=-111.8315' +
        '&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,weathercode' +
        '&hourly=temperature_2m,weathercode,precipitation' +
        '&temperature_unit=celsius' +
        '&precipitation_unit=inch' +
        '&timezone=America%2FPhoenix' +
        '&forecast_days=5';

      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    let weatherData = null;
    let selectedIndex = null;

    function showHourly(dayIndex) {
      const dateStr = weatherData.daily.time[dayIndex];
      const { hourly } = weatherData;

      const hours = hourly.time
        .map((t, i) => ({ time: t, temp: hourly.temperature_2m[i], code: hourly.weathercode[i], precip: hourly.precipitation[i] }))
        .filter(h => h.time.startsWith(dateStr));

      const rows = hours.map(h => {
        const [icon, label] = wmoLookup(h.code);
        const precipStr = h.precip > 0 ? `💧 ${h.precip.toFixed(2)}"` : '';
        return `
          <div class="hour-row">
            <span class="hour-time">${formatHour(h.time)}</span>
            <span class="hour-icon">${icon}</span>
            <span class="hour-condition">${label}</span>
            <span class="hour-temp">${celsiusToF(h.temp)}°F</span>
            <span class="hour-precip">${precipStr}</span>
          </div>`;
      }).join('');

      const label = dayIndex === 0
        ? `Today — ${formatDate(dateStr)}`
        : `${new Date(dateStr + 'T12:00:00').toLocaleDateString('en-US', { weekday: 'long' })} — ${formatDate(dateStr)}`;

      document.getElementById('hourly-title').textContent = label;
      document.getElementById('hourly-rows').innerHTML = rows;

      const panel = document.getElementById('hourly-panel');
      panel.classList.add('open');
      panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function closeHourly() {
      document.getElementById('hourly-panel').classList.remove('open');
      if (selectedIndex !== null) {
        document.querySelectorAll('.day-card')[selectedIndex].classList.remove('selected');
        selectedIndex = null;
      }
    }

    function render(data) {
      weatherData = data;
      const { daily } = data;

      const cards = daily.time.map((dateStr, i) => {
        const [icon, label] = wmoLookup(daily.weathercode[i]);
        const high    = celsiusToF(daily.temperature_2m_max[i]);
        const low     = celsiusToF(daily.temperature_2m_min[i]);
        const precip  = daily.precipitation_sum[i];
        const precipStr = precip > 0 ? `💧 ${precip.toFixed(2)}"` : '';

        return `
          <div class="day-card ${i === 0 ? 'today' : ''}" data-index="${i}">
            <div class="day-name">${formatDay(dateStr, i)}</div>
            <div style="font-size:0.65rem;color:rgba(255,255,255,0.3);margin-bottom:8px">${formatDate(dateStr)}</div>
            <div class="weather-icon">${icon}</div>
            <div class="condition">${label}</div>
            <div class="temps">
              <span class="temp-high">${high}°</span>
              <span class="temp-low">${low}°</span>
            </div>
            <div class="precip">${precipStr}</div>
            <div class="click-hint">tap for hourly</div>
          </div>`;
      }).join('');

      document.getElementById('content').innerHTML = `<div class="forecast-grid">${cards}</div>`;

      document.querySelectorAll('.day-card').forEach(card => {
        card.addEventListener('click', () => {
          const idx = parseInt(card.dataset.index, 10);

          if (selectedIndex === idx) {
            closeHourly();
            return;
          }

          if (selectedIndex !== null) {
            document.querySelectorAll('.day-card')[selectedIndex].classList.remove('selected');
          }

          card.classList.add('selected');
          selectedIndex = idx;
          showHourly(idx);
        });
      });

      document.getElementById('updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    document.getElementById('close-btn').addEventListener('click', closeHourly);

    fetchWeather()
      .then(render)
      .catch(err => {
        document.getElementById('content').innerHTML =
          `<div class="error">Could not load forecast: ${err.message}</div>`;
      });
  </script>
</body>
</html>
